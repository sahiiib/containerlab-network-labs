hostname R4
!
router bgp 65003
 bgp router-id 4.4.4.4
 
 neighbor 10.0.24.1 remote-as 65001
 neighbor 10.0.24.1 bfd
 neighbor 10.0.34.1 remote-as 65002

 !
 address-family ipv4 unicast

  network 203.0.113.0/24

  neighbor 10.0.24.1 route-map ISP-IN in
  neighbor 10.0.24.1 route-map ISP-OUT out

  neighbor 10.0.34.1 route-map ISP-IN in
  neighbor 10.0.34.1 route-map ISP-OUT out

 exit-address-family
!
route-map ISP-IN permit 10
 match ip address prefix-list CUSTOMER-R1
!
route-map ISP-IN deny 100
!
route-map ISP-OUT permit 10
 match ip address prefix-list OWN-PREFIX
!
route-map ISP-OUT deny 100
!
ip prefix-list CUSTOMER-R1 seq 10 permit 192.0.2.0/24
!
ip prefix-list OWN-PREFIX seq 10 permit 203.0.113.0/24
!
