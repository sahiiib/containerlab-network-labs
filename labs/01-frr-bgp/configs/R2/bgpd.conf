hostname R2
!
router bgp 65001
 bgp router-id 2.2.2.2

 neighbor 10.0.12.1 remote-as 65010
 neighbor 10.0.24.2 remote-as 65003
 neighbor 10.0.24.2 bfd

 !
 address-family ipv4 unicast

  neighbor 10.0.12.1 route-map CUSTOMER-IN in
  neighbor 10.0.12.1 route-map CUSTOMER-OUT out

  neighbor 10.0.12.1 soft-reconfiguration inbound
  neighbor 10.0.12.1 maximum-prefix 2 force

  neighbor 10.0.24.2 route-map UPSTREAM-IN in
  neighbor 10.0.24.2 route-map UPSTREAM-OUT out

 exit-address-family
!
ip prefix-list CUSTOMER-R1 seq 10 permit 192.0.2.0/24
!
ip prefix-list UPSTREAM-PREFIX seq 10 permit 203.0.113.0/24
!
route-map CUSTOMER-IN deny 5
 match ip address prefix-list BOGON-V4
!
route-map CUSTOMER-IN permit 10
 match ip address prefix-list CUSTOMER-R1
 match as-path CUSTOMER-AS
!
route-map CUSTOMER-IN deny 100
!
route-map CUSTOMER-OUT permit 10
 match ip address prefix-list UPSTREAM-PREFIX
!
route-map CUSTOMER-OUT deny 100
!
route-map UPSTREAM-IN permit 10
 match ip address prefix-list UPSTREAM-PREFIX
!
route-map UPSTREAM-IN deny 100
!
route-map UPSTREAM-OUT permit 10
 match ip address prefix-list CUSTOMER-R1
!
route-map UPSTREAM-OUT deny 100
!
bgp as-path access-list CUSTOMER-AS permit ^65010$
!
ip prefix-list BOGON-V4 seq 10 permit 10.0.0.0/8 le 32
ip prefix-list BOGON-V4 seq 20 permit 172.16.0.0/12 le 32
ip prefix-list BOGON-V4 seq 30 permit 192.168.0.0/16 le 32
!
