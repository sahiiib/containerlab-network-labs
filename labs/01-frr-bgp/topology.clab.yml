name: frr-bgp

topology:
  nodes:
    R1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R1/daemons:/etc/frr/daemons
        - configs/R1/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip addr add 10.0.12.1/30 dev eth1
        - ip addr add 10.0.13.1/30 dev eth2
        - ip addr add 1.1.1.1/32 dev lo
        - ip route add 198.51.100.1/32 via 10.0.12.2 dev eth1

    R2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R2/daemons:/etc/frr/daemons
        - configs/R2/bgpd.conf:/etc/frr/bgpd.conf
        - configs/R2/bfdd.conf:/etc/frr/bfdd.conf
      exec:
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.0.24.1/30 dev eth2
        - ip addr add 2.2.2.2/32 dev lo
        - ip route add 198.51.100.1/32 via 10.0.24.2 dev eth2

    R3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R3/daemons:/etc/frr/daemons
        - configs/R3/bgpd.conf:/etc/frr/bgpd.conf
      exec:
        - ip addr add 10.0.13.2/30 dev eth1
        - ip addr add 10.0.34.1/30 dev eth2
        - ip addr add 3.3.3.3/32 dev lo

    R4:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/R4/daemons:/etc/frr/daemons
        - configs/R4/bgpd.conf:/etc/frr/bgpd.conf
        - configs/R4/bfdd.conf:/etc/frr/bfdd.conf
      exec:
        - ip addr add 10.0.24.2/30 dev eth1
        - ip addr add 10.0.34.2/30 dev eth2
        - ip addr add 4.4.4.4/32 dev lo
        - ip addr add 203.0.113.1/24 dev lo
        - ip addr add 198.51.100.1/32 dev lo
        - ip route add 10.0.12.0/30 via 10.0.24.1 dev eth1
        - ip route add 10.0.13.0/30 via 10.0.34.1 dev eth2
        - ip route add blackhole 198.51.100.0/24

  links:
    - endpoints: ["R1:eth1", "R2:eth1"]
    - endpoints: ["R1:eth2", "R3:eth1"]
    - endpoints: ["R2:eth2", "R4:eth1"]
    - endpoints: ["R3:eth2", "R4:eth2"]
